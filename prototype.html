<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eid al-Ghadir Mubarak</title>
    <style>
      :root {
        --gold: #fff1aa;
        --gold-2: #f7cf72;
        --deep: #7b4316;
        --green: #2f7d72;
        --ink: #26140a;
        --night: #080816;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--night);
        color: #fff9e8;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .app {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 58%, rgba(47, 125, 114, 0.18), transparent 28rem),
          linear-gradient(180deg, #080816, #120d14 62%, #080816);
      }

      .hero {
        position: relative;
        min-height: 92vh;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(8, 7, 10, 0.58), rgba(8, 7, 10, 0.08) 45%, rgba(8, 7, 10, 0.24)),
          linear-gradient(180deg, rgba(255, 240, 170, 0.08), rgba(0, 0, 0, 0.18) 70%, rgba(0, 0, 0, 0.58)),
          url("public/ghadir-main.jpeg");
        background-position: center;
        background-size: cover;
      }

      .system-name {
        position: absolute;
        top: 1.2rem;
        left: 1.25rem;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        border: 1px solid rgba(255, 241, 170, 0.24);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(8, 8, 22, 0.76), rgba(47, 125, 114, 0.24));
        color: #fff6c8;
        font-size: clamp(1.05rem, 2.4vw, 1.45rem);
        font-weight: 900;
        padding: 0.62rem 0.82rem;
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(14px);
      }

      .system-name::before {
        content: "";
        width: 0.68rem;
        height: 0.68rem;
        border: 2px solid var(--gold);
        transform: rotate(45deg);
        box-shadow: 0 0 18px rgba(255, 241, 170, 0.45);
      }

      .spark {
        position: absolute;
        width: 0.34rem;
        height: 0.34rem;
        border-radius: 999px;
        background: var(--gold);
        box-shadow: 0 0 18px var(--gold);
        animation: sparkRise var(--duration) linear infinite;
      }

      .hero-text {
        position: relative;
        z-index: 2;
        display: flex;
        min-height: 92vh;
        max-width: 1240px;
        align-items: flex-end;
        margin: 0 auto;
        padding: 2rem 1.25rem 7rem;
      }

      .hero-text p {
        margin: 0 0 0.8rem;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.9rem;
        font-weight: 850;
        text-transform: uppercase;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
      }

      .hero-text h1 {
        max-width: 12ch;
        margin: 0;
        color: white;
        font-size: clamp(3rem, 8vw, 6.4rem);
        font-weight: 950;
        line-height: 1;
        text-shadow: 0 12px 30px rgba(0, 0, 0, 0.48);
      }

      .hero-hadith {
        position: absolute;
        inset-inline: 1rem;
        bottom: 1.4rem;
        z-index: 2;
        max-width: 980px;
        margin: auto;
        direction: rtl;
        color: #fff8d7;
        font-family: "Noto Naskh Arabic", Amiri, "Scheherazade New", serif;
        font-size: clamp(1.45rem, 3.4vw, 3.5rem);
        font-weight: 900;
        line-height: 1.7;
        text-align: center;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      }

      .slides {
        padding: 2.5rem 1rem;
      }

      .slides-inner {
        max-width: 1240px;
        margin: 0 auto;
      }

      .slides-head {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .slides-head p {
        margin: 0 0 0.45rem;
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.86rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .slides-head h2 {
        max-width: 780px;
        margin: 0;
        color: white;
        font-size: clamp(2rem, 4.8vw, 4.4rem);
        font-weight: 950;
        line-height: 1;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.35rem;
        border: 1px solid rgba(255, 248, 219, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.35rem;
        backdrop-filter: blur(16px);
      }

      .tab {
        min-height: 2.55rem;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: rgba(255, 249, 232, 0.78);
        font-size: 0.84rem;
        font-weight: 850;
      }

      .tab.active {
        background: linear-gradient(135deg, var(--gold), color-mix(in srgb, var(--green) 62%, white));
        color: var(--ink);
      }

      .stage {
        position: relative;
        min-height: 720px;
        overflow: hidden;
        border: 1px solid rgba(255, 248, 219, 0.16);
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 241, 170, 0.2), transparent 32%),
          radial-gradient(circle at 86% 8%, rgba(47, 125, 114, 0.24), transparent 30%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 42%),
          linear-gradient(150deg, rgba(91, 47, 12, 0.78), rgba(7, 10, 28, 0.92));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
        perspective: 1400px;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle at 50% 18%, rgba(255, 239, 170, 0.12), transparent 24%);
        opacity: 0.38;
        animation: lightDrift 14s linear infinite;
      }

      .slide {
        position: relative;
        z-index: 1;
        min-height: 720px;
        padding: clamp(1rem, 2.4vw, 2rem);
        animation: slideIn 420ms ease-out both;
        transform-style: preserve-3d;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 1rem;
      }

      .card-zone {
        display: grid;
        min-width: 0;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 1rem;
      }

      .toolbar {
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
      }

      .toolbar h3,
      .copy-block h3 {
        margin: 0;
        color: white;
        font-size: clamp(1.35rem, 3vw, 2rem);
        font-weight: 950;
      }

      .toolbar p,
      .copy-block > p:first-child {
        margin: 0 0 0.25rem;
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .icon,
      .primary,
      .secondary {
        display: inline-flex;
        min-height: 2.6rem;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        border-radius: 8px;
        font-weight: 900;
      }

      .icon {
        min-width: 2.6rem;
        border: 1px solid rgba(255, 248, 219, 0.2);
        background: rgba(255, 255, 255, 0.11);
        color: white;
      }

      .primary {
        border: 0;
        background: linear-gradient(135deg, var(--gold), color-mix(in srgb, var(--green) 62%, white));
        color: var(--ink);
        box-shadow: 0 12px 32px rgba(247, 211, 106, 0.24);
      }

      .secondary {
        border: 1px solid rgba(255, 248, 219, 0.22);
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .card-wrap {
        display: grid;
        min-height: 0;
        place-items: center;
        perspective: 1200px;
      }

      .wish-card {
        position: relative;
        width: min(100%, 760px);
        overflow: hidden;
        border: 1px solid rgba(255, 248, 219, 0.2);
        border-radius: 8px;
        aspect-ratio: 4 / 5;
        background-color: #7a4516;
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        transform: rotateY(-5deg) rotateX(2deg);
        transform-style: preserve-3d;
        animation: cardFloat 5.5s ease-in-out infinite alternate;
      }

      .wish-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: saturate(1.04) contrast(1.02);
        transform: none;
      }

      .card-placeholder {
        display: grid;
        width: min(100%, 760px);
        aspect-ratio: 4 / 5;
        place-items: center;
        color: rgba(255, 249, 232, 0.62);
        font-size: 0.92rem;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
      }

      .card-overlay {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 52% 13%, rgba(255, 241, 170, 0.1), transparent 24%),
          linear-gradient(180deg, transparent 0 56%, rgba(8, 8, 18, 0.16) 76%, rgba(8, 8, 18, 0.68));
        pointer-events: none;
      }

      .card-ring {
        display: none;
      }

      .card-copy {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: block;
        color: #fff9e8;
        pointer-events: none;
        text-align: var(--copy-align, center);
        text-shadow: 0 10px 26px rgba(0, 0, 0, 0.48);
      }

      .card-copy > div {
        position: absolute;
        left: var(--copy-x, 50%);
        top: var(--copy-y, 74%);
        width: var(--copy-width, 78%);
        box-sizing: border-box;
        transform: translateX(-50%);
      }

      .eyebrow {
        margin: 0 0 0.45rem;
        color: rgba(255, 255, 255, 0.74);
        font-size: 0.78rem;
        font-weight: 950;
        text-align: var(--copy-align, center);
        text-transform: uppercase;
        text-shadow:
          0 2px 1px rgba(0, 0, 0, 0.62),
          0 8px 18px rgba(0, 0, 0, 0.58);
      }

      .card-message {
        margin: 0;
        color: white;
        font-size: clamp(0.95rem, 2.1vw, 1.9rem);
        font-weight: 950;
        line-height: 1.18;
        overflow-wrap: anywhere;
        text-align: var(--copy-align, center);
        text-shadow:
          0 2px 1px rgba(0, 0, 0, 0.62),
          0 10px 24px rgba(0, 0, 0, 0.62),
          0 0 20px rgba(255, 236, 168, 0.24);
      }

      .card-message.rtl,
      .arabic {
        direction: rtl;
        font-family: "Noto Naskh Arabic", Amiri, "Scheherazade New", serif;
        line-height: 1.38;
      }

      .card-message.rtl {
        font-size: clamp(1rem, 2.3vw, 2rem);
      }

      .from-line {
        direction: ltr;
        margin: 0.55rem 0 0;
        color: rgba(255, 249, 232, 0.9);
        font-size: clamp(0.9rem, 1.7vw, 1.2rem);
        font-weight: 900;
        overflow-wrap: anywhere;
        text-align: var(--copy-align, center);
        text-shadow:
          0 2px 1px rgba(0, 0, 0, 0.62),
          0 9px 20px rgba(0, 0, 0, 0.56);
        unicode-bidi: plaintext;
      }

      .card-copy[data-tone="dark"] .eyebrow,
      .card-copy[data-tone="dark"] .card-message,
      .card-copy[data-tone="dark"] .from-line {
        color: #172018;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9),
          0 8px 20px rgba(255, 255, 255, 0.72);
      }

      .card-copy[data-tone="gold"] .eyebrow,
      .card-copy[data-tone="gold"] .card-message,
      .card-copy[data-tone="gold"] .from-line {
        color: #ffe99d;
        text-shadow:
          0 2px 1px rgba(0, 0, 0, 0.72),
          0 10px 26px rgba(0, 0, 0, 0.68),
          0 0 22px rgba(255, 225, 126, 0.32);
      }

      .thumbs {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 74px;
        gap: 0.55rem;
        overflow-x: auto;
        padding: 0.2rem 0 0.45rem;
      }

      .thumb {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 248, 219, 0.18);
        border-radius: 8px;
        aspect-ratio: 1 / 1;
        background: rgba(255, 255, 255, 0.08);
      }

      .thumb.active {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(247, 211, 106, 0.25);
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .thumb span {
        position: absolute;
        right: 0.35rem;
        bottom: 0.3rem;
        display: grid;
        width: 1.35rem;
        height: 1.35rem;
        place-items: center;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        color: white;
        font-size: 0.72rem;
        font-weight: 950;
      }

      .panel {
        border: 1px solid rgba(255, 248, 219, 0.15);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent), rgba(20, 18, 24, 0.58);
        padding: 1.15rem;
        backdrop-filter: blur(18px);
      }

      .panel h3 {
        margin: 0 0 1rem;
        color: white;
        font-size: 1.6rem;
        font-weight: 950;
      }

      label {
        display: block;
        margin-bottom: 1rem;
      }

      label span {
        display: block;
        margin-bottom: 0.45rem;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.88rem;
        font-weight: 850;
      }

      input {
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid rgba(255, 248, 219, 0.18);
        border-radius: 8px;
        background: rgba(10, 10, 18, 0.34);
        color: white;
        outline: none;
        padding: 0 0.75rem;
      }

      input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(247, 211, 106, 0.25);
      }

      .robot-layout,
      .country-layout,
      .hadith-layout,
      .guidance-layout {
        display: grid;
        grid-template-columns: minmax(280px, 0.72fr) minmax(0, 1fr);
        gap: clamp(1.2rem, 3vw, 3rem);
        align-items: center;
      }

      .copy-block h3 {
        font-size: clamp(2.1rem, 5vw, 4.8rem);
        line-height: 1;
      }

      .copy-block .body {
        max-width: 700px;
        margin: 1rem 0 0;
        color: rgba(255, 249, 232, 0.76);
        font-size: 1.08rem;
        font-weight: 700;
        line-height: 1.7;
      }

      .robot-stage {
        position: relative;
        display: grid;
        min-height: 500px;
        place-items: center;
        perspective: 1000px;
      }

      .robot-halo {
        position: absolute;
        width: min(78vw, 420px);
        aspect-ratio: 1;
        border-radius: 999px;
        background: conic-gradient(from 90deg, transparent, rgba(255, 241, 170, 0.34), rgba(47, 125, 114, 0.22), transparent);
        animation: haloSpin 9s linear infinite;
      }

      .robot {
        position: relative;
        width: 230px;
        height: 330px;
        transform-style: preserve-3d;
        animation: robotFloat 4.2s ease-in-out infinite;
      }

      .robot-head {
        position: absolute;
        left: 50%;
        top: 0;
        display: grid;
        width: 172px;
        height: 132px;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        align-items: center;
        justify-items: center;
        transform: translateX(-50%) rotateX(6deg);
        border: 1px solid rgba(255, 248, 219, 0.38);
        border-radius: 8px;
        background: linear-gradient(145deg, rgba(255, 249, 232, 0.95), rgba(255, 212, 113, 0.84));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      }

      .robot-head::before {
        content: "";
        position: absolute;
        top: -34px;
        width: 5px;
        height: 34px;
        border-radius: 999px;
        background: var(--gold);
      }

      .robot-head::after {
        content: "";
        position: absolute;
        top: -45px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 22px var(--green);
      }

      .eye {
        width: 34px;
        height: 24px;
        border-radius: 999px;
        background: #102d2a;
        box-shadow: inset 0 0 0 5px rgba(123, 212, 181, 0.72);
        animation: eyePulse 1.8s ease-in-out infinite;
      }

      .mouth {
        position: absolute;
        bottom: 24px;
        left: 50%;
        width: 62px;
        height: 10px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #17352f;
      }

      .robot.speaking .mouth {
        height: 20px;
        animation: robotTalk 420ms ease-in-out infinite;
      }

      .robot-body {
        position: absolute;
        left: 50%;
        top: 142px;
        display: grid;
        width: 190px;
        height: 158px;
        place-items: center;
        transform: translateX(-50%) rotateX(-3deg);
        border: 1px solid rgba(255, 248, 219, 0.34);
        border-radius: 8px;
        background: linear-gradient(160deg, rgba(47, 125, 114, 0.94), rgba(13, 48, 45, 0.9));
        box-shadow: 0 28px 65px rgba(0, 0, 0, 0.38);
      }

      .core {
        width: 62px;
        height: 62px;
        border-radius: 999px;
        background: radial-gradient(circle, white 0 18%, var(--gold) 19% 48%, rgba(255, 241, 170, 0.18) 50%);
        box-shadow: 0 0 34px rgba(255, 241, 170, 0.62);
      }

      .arm {
        position: absolute;
        top: 166px;
        width: 34px;
        height: 122px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 249, 232, 0.92), rgba(255, 212, 113, 0.72));
        transform-origin: top center;
      }

      .left-arm {
        left: 0;
        transform: rotate(24deg);
      }

      .right-arm {
        right: 0;
        transform: rotate(-24deg);
      }

      .robot.speaking .left-arm {
        animation: waveLeft 1.2s ease-in-out infinite;
      }

      .robot.speaking .right-arm {
        animation: waveRight 1.2s ease-in-out infinite;
      }

      .language-switch {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.45rem;
        margin-top: 1rem;
        border: 1px solid rgba(255, 248, 219, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.35rem;
      }

      .language-switch button {
        min-height: 2.45rem;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: rgba(255, 249, 232, 0.74);
        font-size: 0.84rem;
        font-weight: 900;
      }

      .language-switch button.active {
        background: linear-gradient(135deg, var(--gold), color-mix(in srgb, var(--green) 62%, white));
        color: var(--ink);
      }

      .ref span {
        display: inline-flex;
        border-radius: 999px;
        background: rgba(255, 241, 170, 0.16);
        color: var(--gold);
        padding: 0.24rem 0.62rem;
        font-size: 0.72rem;
        font-weight: 950;
        text-transform: uppercase;
      }

      .progress {
        position: relative;
        height: 0.62rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        margin-top: 1rem;
      }

      .progress span {
        position: absolute;
        inset-block: 0;
        left: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--gold), var(--green));
        transition: width 250ms ease;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
      }

      .timer {
        min-height: 2.6rem;
        border: 1px solid rgba(255, 248, 219, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.58rem 0.9rem;
        color: white;
        font-weight: 950;
      }

      .country-orbit {
        position: relative;
        min-height: 340px;
      }

      .globe {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        width: 190px;
        height: 190px;
        place-items: center;
        transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-22deg);
        border: 1px solid rgba(255, 248, 219, 0.25);
        border-radius: 999px;
        background: radial-gradient(circle at 35% 30%, rgba(255, 249, 232, 0.9), rgba(255, 212, 113, 0.34) 34%, rgba(47, 125, 114, 0.35) 62%, rgba(7, 10, 28, 0.78));
        box-shadow: inset -22px -28px 52px rgba(0, 0, 0, 0.34), 0 34px 80px rgba(0, 0, 0, 0.34);
        animation: globeTilt 6s ease-in-out infinite alternate;
      }

      .globe span {
        transform: rotateZ(22deg) rotateX(-58deg);
        color: #fff9e8;
        font-size: 1.65rem;
        font-weight: 950;
      }

      .orbit-flag {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(150px) rotate(calc(-1 * var(--angle)));
        border: 1px solid rgba(255, 248, 219, 0.18);
        border-radius: 999px;
        background: rgba(10, 10, 18, 0.62);
        font-size: 1.55rem;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      }

      .country-grid,
      .ref-grid {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));

        transform: translateY(-3px) rotateX(2deg);

        margin-top: auto;
        color: rgba(255, 249, 232, 0.9);

        position: relative;

        width: min(72vw, 360px);
        aspect-ratio: 1.18;
        place-items: center;
        margin: auto;
        perspective: 1000px;
      }

        content: "";
        position: absolute;
        width: 82%;
        aspect-ratio: 1;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 241, 170, 0.28), rgba(47, 125, 114, 0.12) 42%, transparent 70%);

        animation: envelopeGlow 4.8s ease-in-out infinite alternate;

        position: relative;

        aspect-ratio: 1.35;
        transform-style: preserve-3d;
        animation: envelopeFloat 5s ease-in-out infinite alternate;

        position: absolute;
        top: 4%;
        left: 9%;
        z-index: 2;
        display: grid;
        width: 82%;
        height: 70%;
        place-items: center;
        border: 1px solid rgba(255, 248, 219, 0.34);
        border-radius: 8px;
        background:

        text-align: center;
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.24);
        animation: letterRise 5s ease-in-out infinite;

        margin-top: 0.35rem;
        color: rgba(38, 20, 10, 0.72);
        font-size: 0.82rem;

        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;

        height: 66%;
        overflow: hidden;
        border: 1px solid rgba(255, 248, 219, 0.28);

        background: linear-gradient(155deg, rgba(47, 125, 114, 0.94), rgba(18, 50, 46, 0.96));
        box-shadow: 0 28px 75px rgba(0, 0, 0, 0.34);
      }

      .envelope-pocket::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(35deg, rgba(255, 241, 170, 0.32) 0 49.5%, transparent 50%);

        background: linear-gradient(325deg, rgba(255, 241, 170, 0.22) 0 49.5%, transparent 50%);
      }

        position: absolute;

        left: 0;

        height: 44%;

      let robotAudioProgressFrame = null;
      let speechProgressFrame = null;
      let speechPieceDurations = [];
      let speechElapsedBeforePiece = 0;
      let speechEstimatedTotal = 0;
      let speechPieceStartedAt = 0;

      function renderTabs() {
        const tabs = [
          ["cards", "Wish Cards"],
          ["robot", "AI Robot"],
          ["countries", "Shia World"],
          ["hadith", "Hadith"],
          ["guidance", "Guidance"]
        ];
        document.getElementById("tabs").innerHTML = tabs
          .map(([key, label]) => `<button class="tab ${active === key ? "active" : ""}" type="button" onclick="setSlide('${key}')">${label}</button>`)
          .join("");
      }

      function setSlide(key) {
        active = key;
        stopRobot(false);
        render();
      }

      function render() {
        renderTabs();
        if (active === "cards") renderCards();
        if (active === "robot") renderRobot();
        if (active === "countries") renderCountries();
        if (active === "hadith") renderHadith();
        if (active === "guidance") renderGuidance();
      }

      function renderCards() {
        const hasGeneratedCard = selected !== null;
        const cardContent = hasGeneratedCard
          ? `
              <div class="card-wrap">
                <div class="wish-card" id="wishCard" style="background-image:url('${backgrounds[selected]}')">
                  <img src="${backgrounds[selected]}" alt="" loading="eager" />
                </div>
              </div>
            `
          : `
              <div class="card-wrap">
                <div class="card-placeholder">Click Generate</div>
              </div>
            `;
        document.getElementById("stage").innerHTML = `
          <div class="slide grid">
            <div class="card-zone">
              ${cardContent}
            </div>
            <aside class="panel">
              <h3>Wish card</h3>
              <button class="primary" type="button" style="width:100%" onclick="generateCard()">Generate</button>
              <button class="secondary" type="button" style="width:100%; margin-top:0.8rem" onclick="downloadCard()" ${hasGeneratedCard ? "" : "disabled"}>Download</button>
            </aside>
          </div>
        `;
      }

      function differentCardIndex(current) {
        if (current === null) return Math.floor(Math.random() * backgrounds.length);
        if (backgrounds.length < 2) return current;
        const next = Math.floor(Math.random() * (backgrounds.length - 1));
        return next >= current ? next + 1 : next;
      }

      function generateCard() {
        selected = differentCardIndex(selected);
        renderCards();
      }

      function downloadCard() {
        if (selected === null) return;
        const currentCard = selected;
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 1080;
          canvas.height = 1350;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#7a4516";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          drawContain(ctx, image, canvas.width, canvas.height);
          const link = document.createElement("a");
          link.download = `ghadir-card-${currentCard + 1}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        };
        image.src = backgrounds[currentCard];
      }

      function renderRobot() {
        const line = robotLine();
        document.getElementById("stage").innerHTML = `
          <div class="slide robot-layout">
            <div class="robot-stage">
              <div class="robot-halo"></div>
              <div class="robot ${running && !paused ? "speaking" : ""}" id="robotModel">
                <div class="robot-head"><span class="eye"></span><span class="eye"></span><span class="mouth"></span></div>
                <div class="robot-body"><span class="core"></span></div>
                <span class="arm left-arm"></span><span class="arm right-arm"></span>
              </div>
            </div>
            <div class="copy-block">
              <p>Virtual AI greeting robot</p>
              <h3>Ghadir Mubarak wish</h3>
              <div class="language-switch" aria-label="Robot voice language">
                ${robotLines.map((item) => `<button class="${selectedRobotLanguage === item.lang ? "active" : ""}" data-robot-lang="${item.lang}" type="button" onclick="selectRobotLanguage('${item.lang}')">${item.label}</button>`).join("")}
              </div>
              <div class="progress"><span id="robotProgress" style="width:${robotDisplayProgress(line)}%"></span></div>
              <div class="controls">
                <button class="primary" id="robotStart" type="button" onclick="startRobot()">${paused ? "Resume" : "Start"}</button>
                <button class="icon" id="robotPause" type="button" onclick="pauseRobot()" ${!running || paused ? "disabled" : ""}>Ⅱ</button>
                <button class="icon" id="robotStop" type="button" onclick="stopRobot()" ${!running ? "disabled" : ""}>■</button>
                <span class="timer" id="robotTimer">${formatRobotTime(robotDisplaySeconds(line))}</span>
              </div>
            </div>
          </div>
        `;
      }

      function refreshVoices() {
        if (!("speechSynthesis" in window)) return;
        availableVoices = speechSynthesis.getVoices();
        syncRobotContentUi();
        syncRobotUi();
      }

      function robotLine(language = selectedRobotLanguage) {
        return robotLines.find((line) => line.lang === language) || robotLines[0];
      }

      function robotDisplaySeconds(line = robotLine()) {
        if (line.audioSrc && remaining !== 0) return line.audioDurationSeconds || remaining;
        return remaining;
      }

      function robotDisplayProgress(line = robotLine()) {
        if (line.audioSrc) return remaining === 0 ? 100 : 0;
        return ((120 - remaining) / 120) * 100;
      }

      function formatRobotTime(seconds) {
        const safeSeconds = Math.max(0, Math.ceil(seconds));
        return `${Math.floor(safeSeconds / 60)}:${String(safeSeconds % 60).padStart(2, "0")}`;
      }

      function normalizeVoiceLang(lang) {
        return lang.toLowerCase().replace(/_/g, "-");
      }

      function cleanSpeechText(text) {
        return String(text)
          .replace(/[ؑؒؓؔﷺ]/g, " ")
          .replace(/\([^)]*\)/g, " ")
          .replace(/\bAS\b/g, " ")
          .replace(/[0-9۰-۹٠-٩]+/g, " ")
          .replace(/[<>\[\]{}_*#=~|]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function fallbackSpeechText(line, fallbackVoice) {
        if (line.lang === "urdu") {
          return line.romanFallbackText || line.fallbackText || line.spokenText || line.text;
        }

        return line.fallbackText || line.spokenText || line.text;
      }

      function findVoiceByTerms(terms) {
        for (const term of terms) {
          const match = availableVoices.find((voice) => {
            const name = voice.name.toLowerCase();
            const lang = normalizeVoiceLang(voice.lang);
            return name.includes(term) || lang.includes(term);
          });

          if (match) return match;
        }

        return null;
      }

      function isUrduVoice(voice) {
        const name = voice.name.toLowerCase();
        const lang = normalizeVoiceLang(voice.lang);
        return lang.startsWith("ur") || name.includes("urdu");
      }

      function pickRobotVoice(line) {
        const exactLang = line.voiceLang.toLowerCase();
        const baseLang = exactLang.split("-")[0];
        const terms = line.voiceSearch.map((term) => term.toLowerCase());
        const exactVoice = availableVoices.find((voice) => normalizeVoiceLang(voice.lang) === exactLang);

        if (line.lang === "urdu") {
          return exactVoice || availableVoices.find(isUrduVoice) || null;
        }

        return (
          exactVoice ||
          findVoiceByTerms(terms) ||
          availableVoices.find((voice) => normalizeVoiceLang(voice.lang).startsWith(baseLang)) ||
          null
        );
      }

      function pickRobotFallbackVoice(line) {
        const terms = (line.fallbackVoiceSearch || []).map((term) => term.toLowerCase());
        const fallbackLang = normalizeVoiceLang(line.fallbackLang || line.voiceLang);
        const fallbackBase = fallbackLang.split("-")[0];
        return (
          findVoiceByTerms(terms) ||
          availableVoices.find((voice) => normalizeVoiceLang(voice.lang) === fallbackLang) ||
          availableVoices.find((voice) => normalizeVoiceLang(voice.lang).startsWith(fallbackLang)) ||
          availableVoices.find((voice) => normalizeVoiceLang(voice.lang).startsWith(fallbackBase)) ||
          availableVoices.find((voice) => normalizeVoiceLang(voice.lang).startsWith("en")) ||
          null
        );
      }

      function robotSpeechPlan(line) {
        if (line.lang === "urdu") {
          const fallbackVoice = pickRobotFallbackVoice(line);
          return {
            text: cleanSpeechText(fallbackSpeechText(line, fallbackVoice)),
            lang: fallbackVoice ? normalizeVoiceLang(fallbackVoice.lang) : normalizeVoiceLang(line.fallbackLang || line.voiceLang),
            voice: fallbackVoice,
            note: fallbackVoice
              ? `${fallbackVoice.name} (${fallbackVoice.lang}) using natural Roman Urdu`
              : line.accentNote,
            rate: line.rate,
            pitch: line.pitch
          };
        }

        const primaryVoice = pickRobotVoice(line);
        if (primaryVoice) {
          return {
            text: cleanSpeechText(line.spokenText || line.text),
            lang: normalizeVoiceLang(primaryVoice.lang),
            voice: primaryVoice,
            note: `${primaryVoice.name} (${primaryVoice.lang})`,
            rate: line.rate,
            pitch: line.pitch
          };
        }

        const fallbackVoice = pickRobotFallbackVoice(line);
        const selectedFallbackText = fallbackSpeechText(line, fallbackVoice);
        const useFallbackText = selectedFallbackText !== (line.spokenText || line.text);
        return {
          text: cleanSpeechText(selectedFallbackText),
          lang: fallbackVoice ? normalizeVoiceLang(fallbackVoice.lang) : line.fallbackLang || line.voiceLang,
          voice: fallbackVoice,
          note: fallbackVoice
            ? `${fallbackVoice.name} (${fallbackVoice.lang}) using ${useFallbackText ? `${line.accentName} phonetic fallback` : `${line.accentName} fallback`}`
            : line.accentNote,
          rate: line.rate,
          pitch: line.pitch
        };
      }

      function splitSpeechText(text) {
        const maxPieceLength = 150;
        const sentences = (text.match(/[^.!?۔؟।]+[.!?۔؟।]?/g) || [])
          .map((piece) => piece.trim())
          .filter(Boolean);
        const pieces = sentences.flatMap((sentence) => {
          if (sentence.length <= maxPieceLength) return [sentence];

          const clauses = sentence
            .replace(/([,،;؛:])/g, "$1|")
            .split("|")
            .map((clause) => clause.trim())
            .filter(Boolean);
          const balanced = [];
          let current = "";

          clauses.forEach((clause) => {
            const next = current ? `${current} ${clause}` : clause;
            if (next.length > maxPieceLength && current) {
              balanced.push(current);
              current = clause;
            } else {
              current = next;
            }
          });

          if (current) balanced.push(current);
          return balanced.length ? balanced : [sentence];
        });

        return pieces.length ? pieces : [text];
      }

      function speechRateForPiece(line, index, rate) {
        if (line.lang !== "urdu") return rate;

        const cadence = [-0.02, 0.01, -0.01, 0.015];
        return rate + cadence[index % cadence.length];
      }

      function speechPitchForPiece(line, index, pitch) {
        if (line.lang !== "urdu") return pitch;

        const cadence = [0, 0.02, -0.01, 0.01];
        return pitch + cadence[index % cadence.length];
      }

      function speechPauseForPiece(line, piece, restarting) {
        if (line.lang !== "urdu") return restarting ? 760 : 140;
        if (restarting) return 980;
        return /[.!?۔؟।]$/.test(piece) ? 420 : 260;
      }

      function stopRobotAudio(reset = true) {
        cancelAudioProgress();
        if (!robotAudio) return;

        robotAudio.pause();
        if (reset) robotAudio.currentTime = 0;
      }

      function cancelAudioProgress() {
        if (robotAudioProgressFrame !== null) {
          cancelAnimationFrame(robotAudioProgressFrame);
          robotAudioProgressFrame = null;
        }
      }

      function renderAudioProgress(line = robotLine()) {
        let audioMatchesLine = false;

        if (robotAudio && line.audioSrc) {
          audioMatchesLine = robotAudio.src === new URL(line.audioSrc, window.location.href).href;
        }

        const audioDuration =
          robotAudio && audioMatchesLine && Number.isFinite(robotAudio.duration) && robotAudio.duration > 0
            ? robotAudio.duration
            : 0;
        const duration = audioDuration || line.audioDurationSeconds || 0;
        const current = robotAudio && audioMatchesLine && duration ? Math.min(robotAudio.currentTime, duration) : 0;
        const percent = duration ? (current / duration) * 100 : 0;
        const progress = document.getElementById("robotProgress");
        const timer = document.getElementById("robotTimer");
        const robot = document.getElementById("robotModel");

        if (progress) progress.style.width = `${percent}%`;
        if (timer) timer.textContent = formatRobotTime(duration ? duration - current : 0);
        if (robot) robot.classList.toggle("speaking", running && !paused);
      }

      function syncAudioProgress() {
        renderAudioProgress();
        if (!robotAudio) return;

        if (running && !paused && !robotAudio.paused && !robotAudio.ended) {
          robotAudioProgressFrame = requestAnimationFrame(syncAudioProgress);
        }
      }

      function startAudioProgress() {
        cancelAudioProgress();
        robotAudioProgressFrame = requestAnimationFrame(syncAudioProgress);
      }

      function cancelSpeechProgress() {
        if (speechProgressFrame !== null) {
          cancelAnimationFrame(speechProgressFrame);
          speechProgressFrame = null;
        }
      }

      function resetSpeechProgress() {
        cancelSpeechProgress();
        speechPieceDurations = [];
        speechElapsedBeforePiece = 0;
        speechEstimatedTotal = 0;
        speechPieceStartedAt = 0;
      }

      function estimateSpeechPieceMs(line, piece, rate) {
        const words = piece.trim().split(/\s+/).filter(Boolean).length;
        const letters = Array.from(piece).filter((char) => /\S/.test(char)).length;
        const baseSeconds = words > 1 ? words * 0.46 : letters * 0.07;
        const languageFactor = line.lang === "arabic" ? 1.18 : 1;
        const seconds = Math.max(1.2, baseSeconds * languageFactor) / Math.max(rate, 0.5);
        return seconds * 1000;
      }

      function renderSpeechProgress(elapsedMs = speechElapsedBeforePiece) {
        if (!speechEstimatedTotal) return;

        const safeElapsed = Math.max(0, Math.min(elapsedMs, speechEstimatedTotal));
        const percent = (safeElapsed / speechEstimatedTotal) * 100;
        const progress = document.getElementById("robotProgress");
        const timer = document.getElementById("robotTimer");

        if (progress) progress.style.width = `${percent}%`;
        if (timer) timer.textContent = formatRobotTime((speechEstimatedTotal - safeElapsed) / 1000);
      }

      function syncSpeechProgress() {
        const pieceDuration = speechPieceDurations[speechPieceIndex] || 0;
        const elapsedInPiece = Math.min(pieceDuration, performance.now() - speechPieceStartedAt);
        renderSpeechProgress(speechElapsedBeforePiece + elapsedInPiece);

        if (running && !paused) {
          speechProgressFrame = requestAnimationFrame(syncSpeechProgress);
        }
      }

      function startSpeechProgress(pieceIndex) {
        cancelSpeechProgress();
        speechElapsedBeforePiece = speechPieceDurations
          .slice(0, pieceIndex)
          .reduce((sum, duration) => sum + duration, 0);
        speechPieceStartedAt = performance.now();
        speechProgressFrame = requestAnimationFrame(syncSpeechProgress);
      }

      function playRobotAudio(line) {
        if (!line.audioSrc) return;

        const targetSrc = new URL(line.audioSrc, window.location.href).href;
        if (!robotAudio || robotAudio.src !== targetSrc) {
          stopRobotAudio();
          robotAudio = new Audio(line.audioSrc);
          robotAudio.preload = "auto";
        }

        robotAudio.loop = false;
        robotAudio.volume = typeof line.volume === "number" ? line.volume : 1;
        robotAudio.onloadedmetadata = syncAudioProgress;
        robotAudio.ontimeupdate = syncAudioProgress;
        robotAudio.onended = () => {
          if (running && !paused) completeRobotSpeech();
        };
        startAudioProgress();
        robotAudio.play().catch(() => {
          paused = true;
          syncRobotUi();
        });
      }

      function completeRobotSpeech() {
        cancelAudioProgress();
        cancelSpeechProgress();
        const progress = document.getElementById("robotProgress");
        const timer = document.getElementById("robotTimer");

        if (progress) progress.style.width = "100%";
        if (timer) timer.textContent = "0:00";

        speechRunId += 1;
        running = false;
        paused = false;
        remaining = 0;
        clearInterval(robotTimer);
        syncRobotUi();
      }

      function syncRobotUi() {
        if (active !== "robot") return;
        const safeRemaining = Math.max(0, Math.min(120, remaining));
        const robot = document.getElementById("robotModel");
        const progress = document.getElementById("robotProgress");
        const timer = document.getElementById("robotTimer");
        const start = document.getElementById("robotStart");
        const pause = document.getElementById("robotPause");
        const stop = document.getElementById("robotStop");

        if (robot) robot.classList.toggle("speaking", running && !paused);
        const line = robotLine();

        if (line.audioSrc) {
          renderAudioProgress(line);
        } else if (running && speechEstimatedTotal > 0) {
          renderSpeechProgress();
        } else {
          if (progress) progress.style.width = `${((120 - safeRemaining) / 120) * 100}%`;
          if (timer) timer.textContent = formatRobotTime(safeRemaining);
        }
        if (start) start.textContent = paused ? "Resume" : "Start";
        if (pause) pause.disabled = !running || paused;
        if (stop) stop.disabled = !running;
      }

      function syncRobotContentUi() {
        if (active !== "robot") return;
        document.querySelectorAll(".language-switch [data-robot-lang]").forEach((button) => {
          button.classList.toggle("active", button.getAttribute("data-robot-lang") === selectedRobotLanguage);
        });
      }

      function selectRobotLanguage(language) {
        const nextLine = robotLines.find((line) => line.lang === language) || robotLines[0];
        selectedRobotLanguage = language;
        if (running) {
          speechRunId += 1;
          paused = false;
          stopRobotAudio();
          resetSpeechProgress();
          if ("speechSynthesis" in window) speechSynthesis.cancel();
          speechPieces = [];
          speechUsingFallbackText = false;
          if (nextLine.audioSrc) {
            playRobotAudio(nextLine);
          } else {
            speakRobotLine(speechRunId, true);
          }
        }
        syncRobotContentUi();
        syncRobotUi();
      }

      function speakRobotLine(runId = speechRunId, resetQueue = false) {
        const line = robotLine();
        if (line.audioSrc) {
          playRobotAudio(line);
          return;
        }

        if (!("speechSynthesis" in window)) return;
        const plan = robotSpeechPlan(line);

        if (resetQueue || !speechPieces.length) {
          speechPieces = splitSpeechText(plan.text);
          speechPieceIndex = 0;
          speechErrorCount = 0;
          speechUsingFallbackText = Boolean(line.fallbackText && plan.text === cleanSpeechText(line.fallbackText));
          speechPieceDurations = speechPieces.map((piece) => estimateSpeechPieceMs(line, piece, plan.rate));
          speechEstimatedTotal = speechPieceDurations.reduce((sum, duration) => sum + duration, 0);
          speechElapsedBeforePiece = 0;
          renderSpeechProgress(0);
        }

        const pieceIndex = speechPieceIndex;
        const piece = speechPieces[pieceIndex] || speechPieces[0] || plan.text;
        const utterance = new SpeechSynthesisUtterance(piece);
        const useDefaultVoice = speechErrorCount > 0;
        utterance.lang = useDefaultVoice ? normalizeVoiceLang(line.fallbackLang || plan.lang) : plan.lang;
        utterance.rate = speechRateForPiece(line, pieceIndex, plan.rate);
        utterance.pitch = speechPitchForPiece(line, pieceIndex, plan.pitch);
        utterance.volume = typeof line.volume === "number" ? line.volume : 1;
        if (plan.voice && !useDefaultVoice) utterance.voice = plan.voice;
        utterance.onstart = () => {
          startSpeechProgress(pieceIndex);
        };
        utterance.onend = () => {
          cancelSpeechProgress();
          if (speechRunId === runId && running && !paused && remaining > 0) {
            speechErrorCount = 0;
            const nextIndex = pieceIndex + 1;
            const completedMs = speechPieceDurations
              .slice(0, nextIndex)
              .reduce((sum, duration) => sum + duration, 0);
            renderSpeechProgress(completedMs);

            if (nextIndex >= speechPieces.length) {
              completeRobotSpeech();
              return;
            }

            speechPieceIndex = nextIndex;
            setTimeout(() => speakRobotLine(runId), speechPauseForPiece(line, piece, false));
          }
        };
        utterance.onerror = () => {
          cancelSpeechProgress();
          if (speechRunId === runId && running && !paused && remaining > 0) {
            speechErrorCount += 1;
            if (line.fallbackText && !speechUsingFallbackText) {
              speechPieces = splitSpeechText(cleanSpeechText(fallbackSpeechText(line, null)));
              speechPieceIndex = 0;
              speechUsingFallbackText = true;
              speechPieceDurations = speechPieces.map((piece) => estimateSpeechPieceMs(line, piece, plan.rate));
              speechEstimatedTotal = speechPieceDurations.reduce((sum, duration) => sum + duration, 0);
              speechElapsedBeforePiece = 0;
              renderSpeechProgress(0);
            } else {
              speechPieceIndex += 1;
            }

            if (speechErrorCount >= Math.max(3, speechPieces.length) || speechPieceIndex >= speechPieces.length) {
              speechSynthesis.cancel();
              completeRobotSpeech();
              return;
            }

            setTimeout(() => speakRobotLine(runId), 320);
          }
        };
        speechSynthesis.speak(utterance);
      }

      function startRobot() {
        const line = robotLine();
        if (!line.audioSrc && !("speechSynthesis" in window)) {
          remaining = 120;
          running = true;
          paused = false;
          tickRobot();
          syncRobotUi();
          return;
        }

        if (paused) {
          if (line.audioSrc) {
            playRobotAudio(line);
          } else if ("speechSynthesis" in window) {
            speechSynthesis.resume();
            startSpeechProgress(speechPieceIndex);
          }
          paused = false;
          running = true;
          syncRobotUi();
          return;
        }
        remaining = 120;
        running = true;
        paused = false;
        speechRunId += 1;
        stopRobotAudio();
        resetSpeechProgress();
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        speechPieces = [];
        speechPieceIndex = 0;
        speechErrorCount = 0;
        speechUsingFallbackText = false;
        if (line.audioSrc) {
          playRobotAudio(line);
        } else {
          speakRobotLine(speechRunId, true);
        }
        tickRobot();
        syncRobotUi();
      }

      function tickRobot() {
        clearInterval(robotTimer);
        robotTimer = setInterval(() => {
          if (!running || paused) return;
          if (robotLine().audioSrc) return;
          if (speechEstimatedTotal > 0) return;
          remaining -= 1;
          if (remaining <= 0) {
            remaining = 0;
            running = false;
            paused = false;
            speechRunId += 1;
            stopRobotAudio();
            if ("speechSynthesis" in window) speechSynthesis.cancel();
            clearInterval(robotTimer);
            syncRobotUi();
            return;
          }
          syncRobotUi();
        }, 1000);
      }

      function pauseRobot() {
        stopRobotAudio(false);
        cancelSpeechProgress();
        if ("speechSynthesis" in window) speechSynthesis.pause();
        paused = true;
        syncRobotUi();
      }

      function stopRobot(renderAgain = true) {
        speechRunId += 1;
        stopRobotAudio();
        resetSpeechProgress();
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        clearInterval(robotTimer);
        running = false;
        paused = false;
        remaining = 120;
        speechPieces = [];
        speechPieceIndex = 0;
        speechErrorCount = 0;
        speechUsingFallbackText = false;
        if (renderAgain && active === "robot") syncRobotUi();
      }

      function renderCountries() {
        document.getElementById("stage").innerHTML = `
          <div class="slide country-layout">
            <div class="copy-block">
              <p>Countries and flags</p>
              <h3>Where many Shia Muslims live</h3>
              <p class="body">Approximate ranges are based on Pew Research Center estimates. Figures are shown as ranges because sectarian population data is often indirect.</p>
            </div>
            <div class="country-orbit">
              <div class="globe"><span class="arabic">يا علي</span></div>
              ${countries.slice(0, 8).map((c, i) => `<span class="orbit-flag" style="--angle:${i * 45}deg">${c[1]}</span>`).join("")}
            </div>
            <div class="country-grid">${countries.map((c) => `<div class="country"><span class="flag">${c[1]}</span><div><h4>${c[0]}</h4><p>${c[4]}</p></div><strong>${c[2]}</strong><small>${c[3]} of Muslims</small></div>`).join("")}</div>
          </div>
        `;
      }

      function renderHadith() {
        const sunnahCount = references.filter((r) => r[6].includes("sunnah.com")).length;
        const thaqalaynCount = references.filter((r) => r[6].includes("thaqalayn.net")).length;
        document.getElementById("stage").innerHTML = `
          <div class="slide hadith-layout">
            <div class="copy-block">
              <p>Hadith reference numbers</p>
              <h3>Hadith proof from Sunnah.com and Thaqalayn</h3>
              <p class="hadith-main arabic">${hadithText}</p>
              <p class="body">Each card opens the original reference. The Thaqalayn cards include narrations from the Imams and direct Ghadir or Wilayah reports.</p>
            </div>
            <div class="counter-grid">
              <div class="counter"><b>${sunnahCount}</b><p>Sunni references from Sunnah.com</p></div>
              <div class="counter"><b>${thaqalaynCount}</b><p>Imam references from Thaqalayn</p></div>
            </div>
            <div class="ref-grid">${references
              .map((r) => `<a class="ref" href="${r[6]}" target="_blank" rel="noreferrer"><span>${r[0]}</span><h4>${r[1]}</h4><strong>${r[2]}</strong><p>${r[3]}</p><small>${r[4]}</small><em>${r[5]}</em></a>`)
              .join("")}</div>
          </div>
        `;
      }

      function renderGuidance() {
        document.getElementById("stage").innerHTML = `
          <div class="slide guidance-layout">
            <div class="envelope-scene">
              <div class="envelope" aria-label="Animated Wilayah envelope">
                <div class="envelope-card">Wilayah<small class="arabic">الولاية</small></div>
                <div class="envelope-flap"></div>
                <div class="envelope-pocket"></div>
                <div class="envelope-seal">Ali</div>
              </div>
            </div>
            <div class="copy-block">
              <p>Closing prayer</p>
              <h3>The strength of Ali is guidance</h3>
              <p class="body">A final reflection on courage, justice, knowledge, and loyalty to the path of Wilayah.</p>
            </div>
            <div class="guidance-essay">
              <p>Imam Ali ibn Abi Talib (AS) is remembered as the Lion of Allah, the gate of wisdom, the voice of justice, and the hand that stood for truth when truth needed a defender. His power was not only in the sword of courage, but in the light of knowledge, the purity of worship, the mercy shown to the weak, and the strength to stand with the oppressed. Ghadir reminds every heart that Wilayah is a path of loyalty, discipline, bravery, and love for Muhammad and Aale Muhammad. May the name of Ali keep our faith strong, our choices honest, our hearts fearless, and our lives close to the guidance of Allah.</p>
              <div class="guidance-signature">By; Syed Muhammad Hafeez</div>
            </div>
          </div>
        `;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function drawContain(ctx, image, width, height) {
        const scale = Math.min(width / image.width, height / image.height);
        const x = (width - image.width * scale) / 2;
        const y = (height - image.height * scale) / 2;
        ctx.drawImage(image, x, y, image.width * scale, image.height * scale);
      }

      for (let i = 0; i < 34; i += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = `${(i * 17 + 11) % 100}%`;
        spark.style.top = `${(i * 23 + 7) % 100}%`;
        spark.style.animationDelay = `${-((i * 0.43) % 9)}s`;
        spark.style.setProperty("--duration", `${8 + ((i * 0.73) % 7)}s`);
        document.getElementById("sparks").appendChild(spark);
      }

      if ("speechSynthesis" in window) {
        refreshVoices();
        speechSynthesis.onvoiceschanged = refreshVoices;
      }

      render();
    </script>
  </body>
</html>
